name: Validate Builder Inputs

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "input/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "input/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test archive validation and extraction
        run: python -m unittest discover -s tests -v
      - name: Test safe native-mod bundle extraction when present
        run: python scripts/extract_native_mods.py input/mods --destination build-report/validated-native-mods
      - name: Validate supplied ZIP and native mods when present
        run: |
          if [ -f input/instance/instance.zip ] || [ -f input/instance/horizon.zip ]; then
            if [ ! -f input/instance/instance.zip ]; then
              cp input/instance/horizon.zip input/instance/instance.zip
            fi
            if [ -f input/minecraft/minecraft.zip ]; then
              python scripts/prepare.py --minecraft input/minecraft/minecraft.zip
            else
              python scripts/prepare.py
            fi
          else
            echo "::notice::No instance ZIP is checked into this repository; full input validation runs when the manual build receives its ZIP or Release asset."
          fi
